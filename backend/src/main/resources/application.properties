# These will be overridden by Docker environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/client-reservation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lin-fedora}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1997}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
#spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=true

#spring.main.allow-bean-definition-overriding=true
#spring.main.web-application-type=none

server.port=8080

# Mailtrap configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# SMTP Auth and TLS are required by most modern email servers
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

