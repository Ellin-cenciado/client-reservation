<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #f56565;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-edit {
            background: #48bb78;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            margin-right: 10px;
        }

        .btn-edit:hover {
            background: #38a169;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f7fafc;
            color: #2d3748;
            font-weight: 600;
        }

        tr:hover {
            background: #f7fafc;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏨 Reservation System</h1>

    <div id="alert" class="alert"></div>

    <!-- Add/Edit Reservation Form -->
    <div class="card">
        <h2 id="formTitle">Add New Reservation</h2>
        <form id="reservationForm">
            <input type="hidden" id="reservationId">

            <div class="form-group">
                <label for="customerName">Customer Name *</label>
                <input type="text" id="customerName" required>
            </div>

            <div class="form-group">
                <label for="customerEmail">Email *</label>
                <input type="email" id="customerEmail" required>
            </div>

            <div class="form-group">
                <label for="customerPhone">Phone *</label>
                <input type="tel" id="customerPhone" required>
            </div>

            <div class="form-group">
                <label for="checkInDate">Check-in Date *</label>
                <input type="date" id="checkInDate" required>
            </div>

            <div class="form-group">
                <label for="checkOutDate">Check-out Date *</label>
                <input type="date" id="checkOutDate" required>
            </div>

            <div class="form-group">
                <label for="roomType">Room Type *</label>
                <select id="roomType" required>
                    <option value="">Select room type</option>
                    <option value="Single">Single</option>
                    <option value="Double">Double</option>
                    <option value="Suite">Suite</option>
                    <option value="Deluxe">Deluxe</option>
                </select>
            </div>

            <div class="form-group">
                <label for="specialRequests">Special Requests</label>
                <textarea id="specialRequests" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">Add Reservation</button>
            <button type="button" class="btn" onclick="resetForm()" style="background: #cbd5e0;">Cancel</button>
        </form>
    </div>

    <!-- Reservations List -->
    <div class="card">
        <h2>All Reservations</h2>
        <div id="loading" class="loading">Loading reservations...</div>
        <table id="reservationsTable" style="display: none;">
            <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Check-in</th>
                <th>Check-out</th>
                <th>Room Type</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="reservationsBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = '/api/reservation';

    // Load reservations on page load
    document.addEventListener('DOMContentLoaded', () => {
        loadReservations();
    });

    // Handle form submission
    document.getElementById('reservationForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('reservationId').value;
        const reservation = {
            customerName: document.getElementById('customerName').value,
            customerEmail: document.getElementById('customerEmail').value,
            customerPhone: document.getElementById('customerPhone').value,
            checkInDate: document.getElementById('checkInDate').value,
            checkOutDate: document.getElementById('checkOutDate').value,
            roomType: document.getElementById('roomType').value,
            specialRequests: document.getElementById('specialRequests').value
        };

        try {
            let response;
            if (id) {
                // Update existing reservation
                response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reservation)
                });
            } else {
                // Create new reservation
                response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reservation)
                });
            }

            if (response.ok) {
                showAlert('Reservation saved successfully!', 'success');
                resetForm();
                loadReservations();
            } else {
                showAlert('Error saving reservation', 'error');
            }
        } catch (error) {
            showAlert('Error: ' + error.message, 'error');
        }
    });

    // Load all reservations
    async function loadReservations() {
        try {
            const response = await fetch(API_URL);
            const reservations = await response.json();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('reservationsTable').style.display = 'table';

            const tbody = document.getElementById('reservationsBody');
            tbody.innerHTML = '';

            reservations.forEach(reservation => {
                const row = `
                    <tr>
                        <td>${reservation.id}</td>
                        <td>${reservation.customerName}</td>
                        <td>${reservation.customerEmail}</td>
                        <td>${reservation.customerPhone}</td>
                        <td>${reservation.checkInDate}</td>
                        <td>${reservation.checkOutDate}</td>
                        <td>${reservation.roomType}</td>
                        <td class="actions">
                            <button class="btn btn-edit" onclick="editReservation(${reservation.id})">Edit</button>
                            <button class="btn btn-danger" onclick="deleteReservation(${reservation.id})">Delete</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } catch (error) {
            document.getElementById('loading').innerText = 'Error loading reservations';
            showAlert('Error loading reservations: ' + error.message, 'error');
        }
    }

    // Edit reservation
    async function editReservation(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`);
            const reservation = await response.json();

            document.getElementById('reservationId').value = reservation.id;
            document.getElementById('customerName').value = reservation.customerName;
            document.getElementById('customerEmail').value = reservation.customerEmail;
            document.getElementById('customerPhone').value = reservation.customerPhone;
            document.getElementById('checkInDate').value = reservation.checkInDate;
            document.getElementById('checkOutDate').value = reservation.checkOutDate;
            document.getElementById('roomType').value = reservation.roomType;
            document.getElementById('specialRequests').value = reservation.specialRequests || '';

            document.getElementById('formTitle').innerText = 'Edit Reservation';
            document.getElementById('submitBtn').innerText = 'Update Reservation';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (error) {
            showAlert('Error loading reservation: ' + error.message, 'error');
        }
    }

    // Delete reservation
    async function deleteReservation(id) {
        if (!confirm('Are you sure you want to delete this reservation?')) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showAlert('Reservation deleted successfully!', 'success');
                loadReservations();
            } else {
                showAlert('Error deleting reservation', 'error');
            }
        } catch (error) {
            showAlert('Error: ' + error.message, 'error');
        }
    }

    // Reset form
    function resetForm() {
        document.getElementById('reservationForm').reset();
        document.getElementById('reservationId').value = '';
        document.getElementById('formTitle').innerText = 'Add New Reservation';
        document.getElementById('submitBtn').innerText = 'Add Reservation';
    }

    // Show alert message
    function showAlert(message, type) {
        const alert = document.getElementById('alert');
        alert.className = `alert alert-${type}`;
        alert.innerText = message;
        alert.style.display = 'block';

        setTimeout(() => {
            alert.style.display = 'none';
        }, 3000);
    }
</script>
</body>
</html>
